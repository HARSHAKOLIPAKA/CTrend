{% extends "base.html" %}
{% block title %}Chat{% endblock %}

{% block content %}

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="brand">⚡ GOD CHAT</div>

        {% for user in users %}
        <a href="/chat?user={{ user[0] }}"
           class="user {% if selected_user==user[0] %}active{% endif %}">

            <div class="avatar">{{ user[0][0] }}</div>

            <div class="meta">
                <div class="name">{{ user[0] }}</div>
                <div class="status">online</div>
            </div>

        </a>
        {% endfor %}

    </div>

    <!-- CHAT -->
    <div class="chat">

        <div class="header">
            <div>
                <b>{{ selected_user or "Select chat" }}</b>
                <div class="typing" id="typing"></div>
            </div>
        </div>

        <div class="messages" id="messages">

            {% for msg in messages %}
            <div class="msg {% if msg[0]==username %}sent{% else %}recv{% endif %}">
                {{ msg[1] }}
            </div>
            {% endfor %}

        </div>

        <div class="input">
            <input id="msg" placeholder="Type message..."
                   onkeypress="if(event.key==='Enter')send()">

            <button onclick="send()">➤</button>
        </div>

    </div>

</div>

<script>
const selectedUser = "{{ selected_user }}";
</script>

{% endblock %}
