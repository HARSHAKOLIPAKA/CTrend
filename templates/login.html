<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login • Legend</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    font-family:Inter;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#05070d;
    overflow:hidden;
    color:white;
}

/* glowing animated background */
.bg{
    position:absolute;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle at 20% 20%, #7c5cff, transparent 35%),
        radial-gradient(circle at 80% 30%, #00d4ff, transparent 40%),
        radial-gradient(circle at 50% 80%, #4f46e5, transparent 45%);
    filter: blur(70px);
    animation: float 12s infinite alternate ease-in-out;
}

@keyframes float{
    from{transform:translate(-10%,-10%) scale(1);}
    to{transform:translate(10%,10%) scale(1.1);}
}

/* floating particles */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.2;
    animation: rise 8s infinite linear;
}

@keyframes rise{
    from{transform:translateY(100vh); opacity:0;}
    to{transform:translateY(-20vh); opacity:1;}
}

.card{
    position:relative;
    z-index:2;
    width:380px;
    padding:30px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
    animation: pop 0.6s ease;
}

@keyframes pop{
    from{transform:scale(0.9);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-size:22px;
    background:linear-gradient(135deg,#7c5cff,#00d4ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    outline:none;
    background:#111827;
    color:white;
    transition:0.2s;
}

input:focus{
    outline:2px solid #7c5cff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#7c5cff,#00d4ff);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.04);
}

.hint{
    font-size:12px;
    color:#9ca3af;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- particles -->
<script>
for(let i=0;i<25;i++){
    let p = document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(p);
}
</script>

<div class="card">
    <h2>⚡ Welcome Back</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="hint">
        New here? <a href="/register" style="color:#00d4ff">Create account</a>
    </div>
</div>

</body>
</html>
