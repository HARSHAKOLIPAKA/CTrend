<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register • Legend</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#05070d;
    overflow:hidden;
    font-family:Inter;
    color:white;
}

.bg{
    position:absolute;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle at 30% 30%, #00d4ff, transparent 40%),
        radial-gradient(circle at 70% 60%, #7c5cff, transparent 45%);
    filter:blur(70px);
    animation: move 12s infinite alternate;
}

@keyframes move{
    from{transform:translate(-10%,-10%);}
    to{transform:translate(10%,10%);}
}

.card{
    position:relative;
    z-index:2;
    width:380px;
    padding:30px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.12);
}

h2{
    text-align:center;
    background:linear-gradient(135deg,#00d4ff,#7c5cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    outline:none;
    background:#111827;
    color:white;
}

input:focus{
    outline:2px solid #00d4ff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#00d4ff,#7c5cff);
    color:white;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    transform:scale(1.04);
}

.hint{
    text-align:center;
    margin-top:10px;
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">
    <h2>🚀 Create Account</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <div class="hint">
        Already have account? <a href="/login" style="color:#7c5cff">Login</a>
    </div>
</div>

</body>
</html>
