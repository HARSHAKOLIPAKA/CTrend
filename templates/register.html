<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:380px;
            background:#fff;
            border-radius:25px;
            padding:40px 30px;
            box-shadow:0 20px 50px rgba(0,0,0,.2);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h1{
            color:#333;
            font-size:32px;
        }

        .title p{
            color:gray;
            font-size:14px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:#444;
        }

        .input-box input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#f1f1f1;
            outline:none;
            font-size:15px;
        }

        .input-box input:focus{
            border:2px solid #4facfe;
            background:#fff;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            background:#4facfe;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#0099ff;
        }

        .bottom{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .bottom a{
            color:#4facfe;
            text-decoration:none;
            font-weight:600;
        }

        .flash{
            background:#ffeded;
            color:red;
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        @media(max-width:420px){
            .container{
                width:90%;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="title">
        <h1>Create Account 🚀</h1>
        <p>Register to start chatting</p>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="input-box">
            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Choose username"
                   required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>
        </div>

        <button class="btn" type="submit">
            Register
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
